name: Truth Gateway CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0, cache: npm}
      - run: npm ci --ignore-scripts --prefer-offline
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
